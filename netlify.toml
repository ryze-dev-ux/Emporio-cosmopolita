[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

[blobs]

[[redirects]]
  from   = "/api/auth"
  to     = "/.netlify/functions/auth"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/auth/*"
  to     = "/.netlify/functions/auth"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/chat"
  to     = "/.netlify/functions/chat"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/wines-db"
  to     = "/.netlify/functions/wines-db"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/health"
  to     = "/.netlify/functions/health"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/wine-image"
  to     = "/.netlify/functions/wine-image"
  status = 200
  force  = true


[[redirects]]
  from   = "/api/gdrive"
  to     = "/.netlify/functions/gdrive"
  status = 200
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
