<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Cosmos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Fira+Sans:wght@400;500&display=swap">
<style>
  :root {
    --fundo: #F4EFE7;
    --tinta: #26221F;
    --texto: #5E534C;
    --etiqueta: #6B5F57;
    --taupe: #957764;
    --bordo: #5A1E2B;
    --linha: #E2DBD1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: "Fira Sans", "Segoe UI", sans-serif;
    color: var(--tinta);
    background:
      radial-gradient(ellipse 60% 55% at 100% 100%, #EBE2D7 0%, rgba(235,226,215,0) 70%),
      radial-gradient(ellipse 40% 35% at 0% 0%, #EFE8DE 0%, rgba(239,232,222,0) 70%),
      var(--fundo);
    background-attachment: fixed;
  }
  header {
    height: 68px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--linha);
  }
  main {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 48px 24px 116px;
    text-align: center;
  }
  .taca { width: 150px; height: auto; }
  .conteudo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .codigo {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--etiqueta);
  }
  h1 {
    margin: 0;
    font-family: "Playfair Display", "Didot", "Bodoni 72", Georgia, serif;
    font-weight: 500;
    font-size: clamp(44px, 7vw, 84px);
    line-height: 1.04;
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--taupe); }
  p {
    margin: 0;
    max-width: 520px;
    font-size: clamp(16px, 1.6vw, 19px);
    line-height: 1.55;
    color: var(--texto);
  }
  @media (max-width: 600px) {
    .taca { width: 110px; }
    main { gap: 22px; padding-bottom: 72px; }
  }
</style>
</head>
<body>
  <header></header>
  <main>
    <svg class="taca" viewBox="0 0 160 200" fill="none" stroke="#5A1E2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M53 64 C57 88 66 96 80 99 C94 96 103 88 107 64 Z" fill="#5A1E2B" fill-opacity="0.16" stroke="none"/>
      <path d="M48 20 L82 20 L88 30 L96 27 L102 40 L113 46 C110 76 102 94 80 100 C58 94 46 64 48 20 Z"/>
      <path d="M88 30 L85 44 L89 55" stroke-width="1.4"/>
      <path d="M102 40 L99 52" stroke-width="1.4"/>
      <g transform="translate(14 -10) rotate(16 100 30)">
        <path d="M82 20 L112 20 C112.6 30 113 38 113 46 L102 40 L96 27 L88 30 Z"/>
      </g>
      <path d="M80 100 L80 157"/>
      <ellipse cx="80" cy="162" rx="27" ry="5"/>
      <path d="M118 172 L125 167 L128 174 Z" stroke-width="1.6"/>
      <path d="M134 176 L140 174 L140 179 Z" stroke-width="1.6"/>
      <path d="M36 175 L41 170 L44 176 Z" stroke-width="1.6"/>
      <circle cx="126" cy="60" r="1.6" fill="#5A1E2B" stroke="none"/>
      <circle cx="131" cy="74" r="1.2" fill="#5A1E2B" stroke="none"/>
    </svg>
    <div class="conteudo">
      <div class="codigo">Erro 404</div>
      <h1>Ops, esta taça<br>se <span>partiu</span></h1>
      <p>A página que você procura não está disponível — talvez tenha sido servida em outra mesa. Tente novamente em instantes.</p>
    </div>
  </main>
</body>
</html>
