<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Cosmos do Empório Cosmopolita — recomendações personalizadas de vinhos, espumantes e cervejas.">
  <title>Empório Cosmopolita · Cosmos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1781472234">
</head>
<body>
  <!-- Botão para reabrir rail quando collapsed -->
  <!-- Botão fixo de toggle — FORA do rail para nunca sumir -->
  <button class="rail-toggle" id="railToggle" onclick="toggleRail()" title="Recolher menu" aria-label="Recolher/expandir barra lateral">
    <svg id="railToggleIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>
    </svg>
  </button>
  <div class="shell" id="shell">

    <!-- ═══ RAIL ═══ -->
    <aside class="rail">
      <div class="rail-top">
        <a href="/" class="brand">
          <img src="logo.png" alt="Empório Cosmopolita" class="brand-logo">
          <div class="brand-text">
            <span class="brand-name">Empório Cosmopolita</span>
            <span class="brand-sub">Cosmos</span>
          </div>
        </a>
        <button class="new-thread" onclick="newChat()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>
          </svg>
          Nova conversa
        </button>
      </div>

      <p class="rail-section">Conversas</p>
      <div class="thread-list" id="threadList">
        <p class="thread-empty">Nenhuma conversa ainda.</p>
      </div>

      <div class="rail-footer">
        <p class="rail-foot-line">Empório Cosmopolita</p>
        <p class="rail-foot-strong">Cosmos</p>
        <p class="rail-foot-sub">Especialista em vinhos, espumantes e cervejas especiais.</p>
      </div>
    </aside>

    <!-- ═══ STAGE ═══ -->
    <main class="stage">
      <header class="stage-head">
        <div style="display:flex;align-items:center;gap:6px;">
          <img src="logo.png" alt="Empório Cosmopolita" class="stage-logo">
          <div>
            <h1 class="stage-title">Cosmos</h1>
            <p class="stage-sub">Empório Cosmopolita</p>
          </div>
        </div>
        <div class="status" id="statusIndicator">
          <span class="status-dot"></span>
          Cosmos disponível
        </div>
      </header>

      <div class="thread" id="thread"></div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea
            id="msgInput"
            placeholder="Conte-me sobre o momento…"
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"
            rows="1"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <button class="send" id="sendBtn" onclick="sendMessage()" aria-label="Enviar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="composer-foot">Empório Cosmopolita · Cosmos</p>
      </div>
    </main>

  </div><!-- /shell -->
  <script src="js/app.js?v=1781472234"></script>
</body>
</html>
